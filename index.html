<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xeque Treino</title>
<meta name="description" content="Treino de xadrez contra o Stockfish: aberturas, níveis, relógio, professor e sons.">
<meta name="theme-color" content="#e6efec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xeque Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(bricolage.ttf) format("truetype");font-weight:200 800;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:"DM Sans";src:url(dmsans.ttf) format("truetype");font-weight:100 1000;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(jetbrainsmono.ttf) format("truetype");font-weight:100 800;font-display:swap}
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.topbtns{display:flex;align-items:center;gap:8px}
</style>
<style>
  /* Layout: tabuleiro em destaque, painel de controle ao lado (desktop) ou abaixo (celular), navegação flutuante embaixo. Tudo redondo e com botões "de apertar". */
  :root {
    --bg: #e6efec; --bg2: #d6e6e0; --panel: #ffffff; --ink: #10201d; --muted: #4f625d; --line: #c9d8d3;
    --accent: #3358e8; --accent-deep: #2340b8; --accent-ink: #ffffff; --accent-soft: #dfe6ff;
    --gold: #f5b81c; --gold-deep: #c38a00; --gold-ink: #2a1d00; --gold-soft: #fff0c4;
    --sq-light: #eef1e6; --sq-dark: #6c9a82; --frame: #2d4a40;
    --hl: rgba(245, 184, 28, 0.55); --dot: rgba(16, 32, 29, 0.32); --check: rgba(224, 64, 52, 0.8);
    --good: #17713f; --good-bg: #d6f3e3; --warn: #8a5200; --warn-bg: #fdecc4; --bad: #b0261c; --bad-bg: #fde0dc;
    --neutral-bg: #dfe9e5;
    --pw: #fffefa; --pw-line: #14201d; --pb: #1a2220; --pb-line: rgba(255, 255, 255, 0.55);
    --shadow: 0 10px 28px rgba(16, 40, 34, 0.16);
    --f-display: "Bricolage Grotesque", system-ui, sans-serif;
    --f-body: "DM Sans", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1211; --bg2: #0f1c19; --panel: #15221f; --ink: #e7f1ee; --muted: #9bb0aa; --line: #2a3d3a;
      --accent: #7d98ff; --accent-deep: #4a63d6; --accent-ink: #0a1030; --accent-soft: #1d2a55;
      --gold: #f5c542; --gold-deep: #b8890a; --gold-ink: #241900; --gold-soft: #3a2f0c;
      --sq-light: #bccabf; --sq-dark: #4a6e5f; --frame: #050c0b;
      --hl: rgba(245, 197, 66, 0.5); --dot: rgba(10, 20, 18, 0.4);
      --good: #6fdca6; --good-bg: #153a2c; --warn: #f0c068; --warn-bg: #3a2c0e; --bad: #ff9a92; --bad-bg: #40191a;
      --neutral-bg: #1f302d; --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1211; --bg2: #0f1c19; --panel: #15221f; --ink: #e7f1ee; --muted: #9bb0aa; --line: #2a3d3a;
    --accent: #7d98ff; --accent-deep: #4a63d6; --accent-ink: #0a1030; --accent-soft: #1d2a55;
    --gold: #f5c542; --gold-deep: #b8890a; --gold-ink: #241900; --gold-soft: #3a2f0c;
    --sq-light: #bccabf; --sq-dark: #4a6e5f; --frame: #050c0b;
    --hl: rgba(245, 197, 66, 0.5); --dot: rgba(10, 20, 18, 0.4);
    --good: #6fdca6; --good-bg: #153a2c; --warn: #f0c068; --warn-bg: #3a2c0e; --bad: #ff9a92; --bad-bg: #40191a;
    --neutral-bg: #1f302d; --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: linear-gradient(180deg, var(--bg2), var(--bg) 380px);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 15px;
    line-height: 1.45;
    padding-block: 14px 112px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, select, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
  p { margin: 0; }

  .app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { flex: none; width: 48px; height: 48px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 30px; line-height: 1; box-shadow: 0 4px 0 var(--accent-deep); font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", sans-serif; }
  h1 { font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; line-height: 1; }
  .sub { margin-top: 5px; color: var(--muted); font-size: 0.88rem; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .grid.solo { max-width: 760px; width: 100%; margin: 0 auto; }
  @media (min-width: 900px) {
    .grid:not(.solo) { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; gap: 24px; }
  }
  .boardcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  /* ---------- botões ---------- */
  .btn { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 10px 18px; min-height: 48px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 var(--line); text-align: center; }
  .btn:hover { border-color: var(--muted); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep); }
  .btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
  .btn.gold { background: var(--gold); border-color: var(--gold-deep); color: var(--gold-ink); box-shadow: 0 4px 0 var(--gold-deep); }
  .btn.gold:active { box-shadow: 0 1px 0 var(--gold-deep); }
  .btn.round { width: 48px; padding: 0; flex: none; font-size: 1.2rem; }
  .btn.small { min-height: 38px; padding: 6px 14px; font-size: 0.88rem; box-shadow: 0 2px 0 var(--line); }
  .btn.grow { flex: 1; }
  .btn svg { width: 20px; height: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  #act-learn .btn.grow { padding-inline: 10px; white-space: nowrap; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; min-height: 44px; min-width: 44px; padding: 8px 16px; font-weight: 700; cursor: pointer; flex: 1 1 auto; box-shadow: 0 3px 0 var(--line); }
  .pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .pill[aria-checked="true"], .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-deep); }
  .pill.wide { flex: 1 1 100%; text-align: left; border-radius: 20px; font-weight: 600; font-size: 0.88rem; }
  .select { width: 100%; min-height: 48px; padding: 8px 44px 8px 18px; border: 2px solid var(--line); border-radius: 999px; background-color: var(--panel); appearance: none; -webkit-appearance: none; font-weight: 600; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 24px) 52%, calc(100% - 18px) 52%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  .input { flex: 1; min-width: 0; min-height: 48px; padding: 8px 18px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); }

  /* ---------- status e relógios ---------- */
  .status { display: flex; align-items: flex-start; gap: 10px; min-height: 58px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 3px 0 var(--line); }
  .status p { font-size: 0.93rem; padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
  .badge { flex: none; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.gold { background: var(--gold-soft); color: var(--warn); }
  .clockbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 16px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); }
  .clockbar .who { font-size: 0.85rem; font-weight: 700; color: var(--muted); min-width: 0; }
  .clockbar .t { font: 700 1.4rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .clockbar.act { border-color: var(--accent); }
  .clockbar.act .t { color: var(--accent); }
  .clockbar.low .t { color: var(--bad); }

  /* ---------- tabuleiro ---------- */
  .boardwrap { background: var(--frame); padding: clamp(5px, 1.8vw, 9px); border-radius: 24px; box-shadow: var(--shadow); }
  .board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; container-type: inline-size; user-select: none; -webkit-user-select: none; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: 0; border-radius: 0; background: var(--sq-light); cursor: pointer; min-width: 0; min-height: 0; }
  .sq.d { background: var(--sq-dark); }
  .sq.last::before { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .sq.chk::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--check) 0%, transparent 72%); }
  .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--hl); box-shadow: inset 0 0 0 0.6cqw var(--accent); }
  .sq.gd::before { content: ""; position: absolute; inset: 0; background: var(--hl); box-shadow: inset 0 0 0 0.8cqw var(--gold-deep); }
  .sq.bad::before { content: ""; position: absolute; inset: 0; background: var(--check); opacity: 0.6; }
  .sq.dot::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--dot); z-index: 2; }
  .sq.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 1.1cqw solid var(--dot); z-index: 2; }
  .pc { position: relative; z-index: 1; font-size: 10.6cqw; line-height: 1; font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", sans-serif; font-variant-emoji: text; paint-order: stroke fill; filter: drop-shadow(0 0.9cqw 0.6cqw rgba(0, 0, 0, 0.28)); }
  .pc.w { color: var(--pw); -webkit-text-stroke: 0.42cqw var(--pw-line); }
  .pc.b { color: var(--pb); -webkit-text-stroke: 0.18cqw var(--pb-line); }
  .sq.sel .pc { transform: translateY(-6%) scale(1.1); }
  .sq.bad .pc { animation: shake 0.4s; }
  .co { position: absolute; z-index: 2; font: 700 2.7cqw/1 var(--f-mono); color: var(--sq-dark); pointer-events: none; }
  .sq.d .co { color: var(--sq-light); }
  .co.rk { top: 0.9cqw; left: 1cqw; }
  .co.fl { bottom: 0.8cqw; right: 1cqw; }
  .promo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 24px; background: var(--panel); }
  .promo .t { font-weight: 700; margin-right: 4px; }

  /* ---------- painéis ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
  .panel h2 { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; }
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lbl { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 0.85rem; color: var(--muted); }
  .levelname { font-size: 0.9rem; }
  .thead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .thead .tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .tag { display: inline-block; width: fit-content; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .steps { display: flex; gap: 8px; }
  .step { flex: 1; border: 2px solid var(--line); background: var(--panel); border-radius: 999px; min-height: 46px; padding: 6px 8px; font-weight: 700; font-size: 0.86rem; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
  .step[aria-selected="true"] { background: var(--gold); border-color: var(--gold-deep); color: var(--gold-ink); box-shadow: 0 3px 0 var(--gold-deep); }
  .ideas { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .notebox { background: var(--gold-soft); border-radius: 22px; padding: 12px 16px; min-height: 76px; }
  .notebox b { font-family: var(--f-mono); }
  .line { display: flex; flex-wrap: wrap; gap: 5px 4px; font-family: var(--f-mono); font-size: 0.86rem; align-items: center; }
  .line .n { color: var(--muted); margin: 0 1px 0 6px; }
  .chip { border: 0; background: var(--neutral-bg); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: inherit; min-height: 34px; }
  .chip.on { background: var(--accent); color: var(--accent-ink); }
  .moves { display: grid; grid-template-columns: 2.4em 1fr 1fr; gap: 2px 8px; max-height: 180px; overflow-y: auto; font-family: var(--f-mono); font-size: 0.85rem; padding: 10px 14px; border-radius: 22px; background: var(--bg); }
  .moves .mn { color: var(--muted); }
  .moves .mv.now { font-weight: 700; color: var(--accent); }
  .moves .empty { grid-column: 1 / -1; color: var(--muted); font-family: var(--f-body); }
  .track { height: 14px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; background: var(--neutral-bg); box-shadow: inset 0 0 0 2px var(--line); }
  .pip.on { background: var(--gold); box-shadow: inset 0 0 0 2px var(--gold-deep); }
  .result { border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--good-bg); color: var(--ink); }
  .result.mid { background: var(--warn-bg); }
  .result h3 { font-size: 1.05rem; }

  .olist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ocard { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; border: 2px solid var(--line); background: var(--panel); border-radius: 24px; padding: 14px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
  .ocard:hover { border-color: var(--accent); }
  .ocard:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .oc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .oc-top b { font-family: var(--f-display); font-size: 1.02rem; }
  .oc-sum { font-size: 0.85rem; color: var(--muted); }
  .oc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .mlabel { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .resume { background: var(--gold-soft); border-color: var(--gold-deep); }

  /* ---------- professor ---------- */
  .chat { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; min-height: 180px; overflow-y: auto; padding: 4px 2px; }
  .bubble { max-width: 90%; padding: 10px 15px; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.bot { align-self: flex-start; background: var(--neutral-bg); border-bottom-left-radius: 8px; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 8px; }
  .bubble.pending { opacity: 0.7; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .qchip { flex: none; white-space: nowrap; }
  .qchip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; min-height: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 0 var(--line); }
  .qchip.gold { background: var(--gold-soft); border-color: var(--gold-deep); }
  .qchip:active { transform: translateY(1px); box-shadow: none; }
  .askrow { display: flex; gap: 10px; }

  /* ---------- navegação ---------- */
  .bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none; padding-top: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bn-in { pointer-events: auto; display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); width: 100%; max-width: 440px; }
  .bn { flex: 1; border: 0; background: transparent; border-radius: 999px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.74rem; font-weight: 700; color: var(--muted); cursor: pointer; }
  .bn svg { width: 24px; height: 24px; }
  .bn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-deep); }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall 2s ease-in forwards; }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8%); } 75% { transform: translateX(8%); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.9; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .pill, .step, .chip, .ocard, .qchip, .bn { transition: background 0.12s, border-color 0.12s, transform 0.08s, box-shadow 0.08s; }
    .pc { transition: transform 0.12s; }
    .panel > *, .bubble, .result { animation: rise 0.25s ease-out; }
  }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>
<script src="chess.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#9822;&#xFE0E;</span>
      <div>
        <h1>Xeque Treino</h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <div class="topbtns"><button class="btn small" id="install-btn" hidden>Instalar app</button><button class="btn round" id="snd-btn" data-act="snd" aria-pressed="true" aria-label="Som"></button></div>
  </header>

  <main class="grid" id="grid">
    <section class="boardcol" id="boardcol">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="clockbar" id="clk-top" hidden></div>
      <div class="boardwrap"><div class="board" id="board" role="group" aria-label="Tabuleiro de xadrez"></div></div>
      <div class="clockbar" id="clk-bot" hidden></div>
      <div class="promo" id="promo" hidden></div>
      <div class="actions" id="act-play">
        <button class="btn grow" data-act="undo">Desfazer</button>
        <button class="btn grow gold" data-act="hint">Dica da teoria</button>
        <button class="btn grow" data-act="flip">Virar</button>
      </div>
      <div class="actions" id="act-learn" hidden>

  2: { depth: 1, time: 300,  margin: 250, random: 0.1 },
  3: { depth: 2, time: 800,  margin: 90,  random: 0 },

function evaluate(g) {
  const b = g.board();
  let s = 0;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = b[r][c];
    if (!p) continue;
    if (p.color === 'w') s += VAL[p.type] + PST[p.type][r * 8 + c];
    else s -= VAL[p.type] + PST[p.type][(7 - r) * 8 + c];
  }
  return s;
}
function moveScore(m) { let s = 0; if (m.captured) s += 10 * VAL[m.captured] - VAL[m.piece]; if (m.promotion) s += 800; return s; }
function orderMoves(ms) { return ms.sort((a, b) => moveScore(b) - moveScore(a)); }
function mk(g, m) { return g.move({ from: m.from, to: m.to, promotion: m.promotion }); }
function quiesce(g, alpha, beta, ctx, qd) {
  const sign = g.turn() === 'w' ? 1 : -1;
  const stand = sign * evaluate(g);
  if (qd <= 0) return stand;
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  const caps = orderMoves(g.moves({ verbose: true }).filter(m => m.captured || m.promotion));
  for (const m of caps) {
    mk(g, m);
    const sc = -quiesce(g, -beta, -alpha, ctx, qd - 1);
    g.undo();
    if (sc >= beta) return beta;
    if (sc > alpha) alpha = sc;
  }
  return alpha;
}
function negamax(g, depth, alpha, beta, ply, ctx) {
  if ((++ctx.nodes & 255) === 0 && Date.now() > ctx.deadline) ctx.abort = true;

/* ============ Stockfish ============ */
const SF = { worker: null, state: 'idle', busy: false, discard: 0, onBest: null, onInfo: null, owner: null, waiters: [], timer: null };
const SF_LEVELS = { 1: { skill: 0, ms: 60 }, 2: { elo: 1320, ms: 150 }, 3: { elo: 1700, ms: 300 }, 4: { elo: 2200, ms: 600 }, 5: { skill: 20, ms: 1500 } };
function sfSet(state) {
  SF.state = state;
  const msgs = { loading: 'Carregando o Stockfish…', ready: 'Motor: Stockfish 19.', failed: 'O Stockfish não carregou neste aparelho. Usando o motor simples do app.' };
  const el = $('engine-note');
  if (el) el.textContent = msgs[state] || '';
  if (state === 'ready' || state === 'failed') { const w = SF.waiters; SF.waiters = []; w.forEach(f => f()); }
  if (S) syncSettings();
}
function sfFail() {
  clearTimeout(SF.timer);
  try { if (SF.worker) SF.worker.terminate(); } catch (e) {}
  SF.worker = null; SF.busy = false; SF.discard = 0;
  const cb = SF.onBest; SF.onBest = null; SF.onInfo = null;
  sfSet('failed');
  if (cb) cb(null);
}
function sfInit() {
  try {
    sfSet('loading');
    const w = new Worker('stockfish-19-lite-single.js');
    SF.worker = w;
    SF.timer = setTimeout(() => { if (SF.state === 'loading') sfFail(); }, 10000);
    w.onerror = () => sfFail();
    w.onmessage = ev => {
      const line = typeof ev.data === 'string' ? ev.data : '';
      if (line === 'uciok') w.postMessage('isready');
      else if (line === 'readyok') { if (SF.state === 'loading') { clearTimeout(SF.timer); w.postMessage('ucinewgame'); sfSet('ready'); } }
      else if (line.indexOf('info') === 0) { if (SF.onInfo) SF.onInfo(line); }
      else if (line.indexOf('bestmove') === 0) {
        SF.busy = false;
        if (SF.discard > 0) { SF.discard--; return; }
        const cb = SF.onBest; SF.onBest = null;
        if (cb) cb(line.split(' ')[1]);
      }
    };
    w.postMessage('uci');
  } catch (e) { sfFail(); }
}
function sfAbort(st) {
  if (SF.owner !== st) return;
  if (SF.worker && SF.busy) { SF.discard++; SF.worker.postMessage('stop'); }
  SF.onBest = null; SF.onInfo = null;
}
function uciToMove(g, uci) {
  if (!uci || uci.length < 4) return null;
  const from = uci.slice(0, 2), to = uci.slice(2, 4), pr = uci[4];
  return g.moves({ verbose: true }).find(m => m.from === from && m.to === to && (!m.promotion || m.promotion === (pr || 'q'))) || null;
}
function uciHistory(g) { return g.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || '')); }
function engineMove(st, done, tok) {
  if (tok !== st.token) return;
  const g = st.game;
  if (SF.state === 'loading') { SF.waiters.push(() => engineMove(st, done, tok)); return; }
  if (SF.state !== 'ready' || !SF.worker) { setTimeout(() => { if (tok === st.token) done(chooseMove(g, st.level)); }, 20); return; }
  if (SF.busy) { setTimeout(() => engineMove(st, done, tok), 120); return; }
  const c = SF_LEVELS[st.level] || SF_LEVELS[3], w = SF.worker;
  if (c.elo) { w.postMessage('setoption name UCI_LimitStrength value true'); w.postMessage('setoption name UCI_Elo value ' + c.elo); }
  else { w.postMessage('setoption name UCI_LimitStrength value false'); w.postMessage('setoption name Skill Level value ' + c.skill); }
  const mv = uciHistory(g);
  w.postMessage('position startpos' + (mv.length ? ' moves ' + mv.join(' ') : ''));
  SF.busy = true; SF.owner = st;
  SF.onBest = uci => { done(uciToMove(g, uci) || chooseMove(g, st.level)); };
  w.postMessage('go movetime ' + c.ms);
}
function sfAnalyze(g, ms, cb, tries) {
  tries = tries || 0;
  if (SF.state === 'loading') { SF.waiters.push(() => sfAnalyze(g, ms, cb, tries)); return; }
  if (SF.state !== 'ready' || !SF.worker) { cb(null); return; }
  if (SF.busy) { if (tries > 40) { cb(null); return; } setTimeout(() => sfAnalyze(g, ms, cb, tries + 1), 150); return; }
  const w = SF.worker, turn = g.turn(), mv = uciHistory(g);
  SF.owner = 'analysis';
  w.postMessage('setoption name UCI_LimitStrength value false');
  w.postMessage('setoption name Skill Level value 20');
  w.postMessage('position startpos' + (mv.length ? ' moves ' + mv.join(' ') : ''));
  let last = null;
  SF.onInfo = line => {
    const m = /score (cp|mate) (-?\d+)/.exec(line);
    if (m) last = { kind: m[1], v: (turn === 'w' ? 1 : -1) * Number(m[2]) };
  };
  SF.busy = true;
  SF.onBest = uci => { SF.onInfo = null; const m = uciToMove(g, uci); cb({ san: m ? m.san : uci, score: last }); };
  w.postMessage('go movetime ' + ms);
}
function evalText(s) {
  if (!s) return 'sem avaliação';
  if (s.kind === 'mate') return s.v > 0 ? `mate das brancas em ${s.v}` : `mate das pretas em ${-s.v}`;
  const p = s.v / 100, a = Math.abs(p);
  const txt = (p > 0 ? '+' : p < 0 ? '−' : '') + a.toFixed(1).replace('.', ',');
  const who = a < 0.3 ? 'posição equilibrada' : (p > 0 ? 'brancas' : 'pretas') + (a < 1 ? ' um pouco melhores' : a < 2.5 ? ' melhores' : ' com grande vantagem');
  return `${txt} (${who})`;
}

/* ============ Relógio (somente na aba Jogar) ============ */
const TIMES = { 'none': null, '1+0': [60, 0], '3+0': [180, 0], '3+2': [180, 2], '5+0': [300, 0], '5+3': [300, 3], '10+0': [600, 0], '10+5': [600, 5], '15+10': [900, 10], '30+0': [1800, 0] };
const C = { on: false, inc: 0, w: 0, b: 0, last: 0, timer: null };
function fmt(ms) {
  if (ms < 20000) return (Math.max(0, ms) / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function clockPaint() {
  const top = $('clk-top'), bot = $('clk-bot');
  const show = C.on && TAB === 'play' && !!P;
  top.hidden = !show; bot.hidden = !show;
  if (!show) return;
  const bc = P.flipped ? 'b' : 'w', tc = bc === 'w' ? 'b' : 'w';
  const run = (!P.flag && !P.game.game_over() && P.game.history().length >= 2) ? P.game.turn() : null;
  const html = c => `<span class="who">${c === P.user ? 'Você' : 'Oponente'} · ${sideName(c)}</span><span class="t">${fmt(C[c])}</span>`;
  top.innerHTML = html(tc); bot.innerHTML = html(bc);
  top.className = 'clockbar' + (run === tc ? ' act' : '') + (C[tc] < 20000 ? ' low' : '');
  bot.className = 'clockbar' + (run === bc ? ' act' : '') + (C[bc] < 20000 ? ' low' : '');
}
function clockFlag(color) {
  P.flag = color; P.token++; sfAbort(P);
  if (color !== P.user) P.celebrate = true;
  sfx(color !== P.user ? 'win' : 'lose');
  P.thinking = false; P.sel = null; P.targets = []; P.promo = null; P.hint = ''; P.guide = null;
  upd(P);
}
function clockTick() {
  const now = Date.now(), dt = now - C.last;
  C.last = now;
  if (!C.on || P.flag || P.game.game_over() || TAB !== 'play') { clockPaint(); return; }
  if (P.game.history().length >= 2) {
    const turn = P.game.turn();
    C[turn] -= dt;
    if (turn === P.user && C[turn] > 0 && C[turn] < 10000) { const sec = Math.ceil(C[turn] / 1000); if (sec !== C.tickSec) { C.tickSec = sec; sfx('tick'); } }
    if (C[turn] <= 0) { C[turn] = 0; clockFlag(turn); return; }
  }
  clockPaint();
}
function clockMoved(color) { if (C.on && P.game.history().length > 2) C[color] += C.inc; }
function clockReset() {
  P.flag = null;
  clearInterval(C.timer); C.timer = null;
  const t = TIMES[cfg.time];
  C.on = !!t;
  if (t) { C.w = t[0] * 1000; C.b = t[0] * 1000; C.inc = t[1] * 1000; C.last = Date.now(); C.timer = setInterval(clockTick, 100); }
}

/* ============ Desenho do tabuleiro ============ */
function sqXY(sq, flipped) {
  let c = FILES.indexOf(sq[0]), r = 8 - Number(sq[1]);
  if (flipped) { c = 7 - c; r = 7 - r; }
  return [c, r];
}
function animatePiece(a, flipped) {
  const el = $('board').querySelector('.sq[data-v="' + a.to + '"] .pc');
  if (!el) return;
  const f = sqXY(a.from, flipped), t = sqXY(a.to, flipped);
  el.style.transition = 'none';
  el.style.transform = `translate(${(f[0] - t[0]) * 12.5}cqw, ${(f[1] - t[1]) * 12.5}cqw)`;
  el.style.zIndex = 5;
  void el.offsetWidth;
  el.style.transition = 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)';
  el.style.transform = '';
}
function renderBoard(g, o) {
  const b = g.board(), hist = g.history({ verbose: true }), last = hist[hist.length - 1];
  let chk = null;
  if (g.in_check()) {
    const t = g.turn();
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = b[r][c]; if (p && p.type === 'k' && p.color === t) chk = FILES[c] + (8 - r); }
  }
  const tg = {};
  (o.targets || []).forEach(t => { tg[t.to] = t; });
  const guide = new Set(o.guide || []), bad = new Set(o.bad || []);
  let html = '';
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const row = o.flipped ? 7 - r : r, col = o.flipped ? 7 - c : c, sq = FILES[col] + (8 - row), p = b[row][col];
    const cls = ['sq'];
    if ((row + col) % 2 === 1) cls.push('d');
    if (last && (last.from === sq || last.to === sq)) cls.push('last');
    if (chk === sq) cls.push('chk');
    if (o.sel === sq) cls.push('sel');
    if (guide.has(sq)) cls.push('gd');
    if (bad.has(sq)) cls.push('bad');
    if (tg[sq]) cls.push(p || tg[sq].flags.indexOf('e') >= 0 ? 'cap' : 'dot');
    const label = sq + (p ? ', ' + PT[p.type] + (p.color === 'w' ? ' branco' : ' preto') : '');
    html += `<button class="${cls.join(' ')}" data-act="sq" data-v="${sq}" aria-label="${label}">`;
    if (c === 0) html += `<span class="co rk">${8 - row}</span>`;
    if (r === 7) html += `<span class="co fl">${FILES[col]}</span>`;
    if (p) html += `<span class="pc ${p.color}">${GLYPH[p.type]}${VS}</span>`;
    html += '</button>';
  }
  $('board').innerHTML = html;
  if (o.anim && !reduced()) animatePiece(o.anim, o.flipped);
}
function boardOpts(st) {
  const o = { flipped: st.flipped, sel: st.sel, targets: st.targets, anim: st.anim, bad: st.bad };
  let guide = st.guide ? st.guide.slice() : null;
  if (st.drill && !st.drill.done && st.game.turn() === st.user && !st.thinking) {
    if (st.drill.guided || st.drill.wrong) guide = sanToSquares(st.game, st.drill.toks[st.game.history().length]) || guide;
  }
  o.guide = guide;
  st.anim = null;

}

/* ============ Textos de status ============ */
function setStatus(label, cls, html) { $('status').innerHTML = `<span class="badge ${cls}">${label}</span><p>${html}</p>`; }
function overText(st) {
  const g = st.game;
  if (g.in_checkmate()) return g.turn() === st.user ? 'Xeque-mate. O oponente venceu.' : 'Xeque-mate! Você venceu.';
  if (g.in_stalemate()) return 'Empate por afogamento.';
  if (g.insufficient_material()) return 'Empate por material insuficiente.';
  if (g.in_threefold_repetition()) return 'Empate por repetição de posição.';
  return 'Empate pela regra dos 50 lances.';
}
function renderStatus(st) {
  const g = st.game, o = st.opening;
  if (TAB === 'train' && T.stage === 'learn') {
    const op = openingById(T.id), toks = op.moves[T.line];
    let where = 'Posição inicial.';
    if (T.ply > 0) { const i = T.ply - 1; where = 'Após ' + moveLabel(i, lineVerbose(op, T.line)[i] ? lineVerbose(op, T.line)[i].san : toks[i]) + '.'; }
    setStatus('Aula', 'good', `${esc(op.name)}. ${where}`);
    return;
  }
  if (st.mode === 'idle') { setStatus('Teste', '', 'Escolha o nível no painel e comece a partida de teste.'); return; }
  if (st.mode === 'drill') {
    const d = st.drill;
    if (d.done) { setStatus('Linha completa', d.result === 'clean' ? 'good' : 'gold', d.result === 'clean' ? 'Você jogou a linha inteira sem ajuda e sem erros.' : 'Linha concluída. Veja o resultado no painel.'); return; }
    if (st.thinking) { setStatus('Oponente', '', 'Responde pela teoria…'); return; }
    const exp = d.toks[g.history().length];
    const sh = exp ? (sanToSquares(g, exp) ? g.moves({ verbose: true }).find(x => norm(x.san) === exp).san : exp) : '';
    if (d.wrong) { setStatus('Fora do livro', 'bad', `Você jogou ${esc(d.wrong)}. O livro pede <b>${esc(sh)}</b> (casas marcadas). Tente de novo.`); return; }
    if (d.guided) { setStatus('Guiado', 'good', `Sua vez. O livro pede <b>${esc(sh)}</b> (casas marcadas).`); return; }
    setStatus('Sem ajuda', 'gold', `Sua vez. Lembra o próximo lance? Lance ${Math.floor(g.history().length / 2) + 1} de ${Math.ceil(d.toks.length / 2)}.`);
    return;
  }
  if (st.flag) { setStatus('Fim', st.flag === st.user ? 'bad' : 'good', st.flag === st.user ? 'Seu tempo acabou. O oponente venceu.' : 'O tempo do oponente acabou. Você venceu!'); return; }
  if (g.game_over()) { setStatus('Fim', g.in_checkmate() ? (g.turn() !== st.user ? 'good' : 'bad') : '', overText(st)); return; }
  if (st.thinking) {
    if (st.book.state === 'out' && st.book.msg) setStatus('Fora da teoria', 'warn', esc(st.book.msg) + ' O oponente está pensando…');
    else setStatus('Oponente', '', 'Pensando…');
    return;
  }
  if (st.hint) { setStatus('Dica', 'good', esc(st.hint)); return; }
  const chk = g.in_check() ? ' Seu rei está em xeque.' : '';
  const stt = st.book.state, n = g.history().length;
  const hiddenRand = st.mode === 'play' && st.pick === 'random' && !st.revealed && o;
  const label = hiddenRand ? 'abertura sorteada' : (o ? o.name : '');
  const reveal = hiddenRand ? ' <button class="btn small" data-act="reveal">Revelar</button>' : '';

    if (st.mode === 'test') setStatus('Na teoria', 'good', `Teste de ${esc(label)}: siga a linha. ` + (n === 0 || (n === 1 && st.user === 'b') ? 'Faça seu primeiro lance.' : 'Sua vez.') + chk);

  else setStatus('Sem livro', '', 'Sua vez.' + chk);

const stripAcc = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function matchKB(text) {
  const t = stripAcc(text);
  let best = null, bs = 0;
  KB.forEach(k => { let s = 0; k.keys.forEach(w => { if (t.indexOf(stripAcc(w)) >= 0) s += w.length; }); if (s > bs) { bs = s; best = k; } });
  return best;
}

async function aiAnswer(content) {

  el.classList.add('pending');
  Q.hist.push({ role: 'user', content });
  let h = Q.hist.slice(-9);
  while (h.length && h[0].role !== 'user') h.shift();
  const turns = h.map((m, i) => (i === h.length - 1 ? { role: 'user', content: RULES + '\n\n' + ctxText() + '\n\nPergunta do aluno: ' + m.content } : m));

    const r = await Q.ai(turns, { cache: false, signal: ctl.signal, modelTier: 'default', onText: u => { el.classList.remove('pending'); el.textContent = u.text; $('chat').scrollTop = $('chat').scrollHeight; } });

    el.classList.remove('pending');
    el.textContent = r.text + (r.truncated ? '\n(Resposta cortada. Peça menos de cada vez.)' : '');

  for (let i = 0; i < 26; i++) h += `<i style="left:${Math.random() * 100}%;background:${cols[i % 4]};animation-delay:${(Math.random() * 0.5).toFixed(2)}s;animation-duration:${(1.6 + Math.random() * 1.2).toFixed(2)}s"></i>`;
  box.innerHTML = h;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3200);
}
function setTab(t) {
  TAB = t;
  if (t === 'play') S = P; else if (t === 'train') S = R;
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
}

/* ============ Eventos ============ */
const ACT = {
  tab: v => setTab(v),
  sq: v => squareClick(S, v),
  promo: v => { if (S.promo) doUserMove(S, S.promo.from, S.promo.to, v); },
  newgame: () => { startPlay(); sfx('start'); },
  undo: () => undo(S),
  hint: () => giveHint(S),
  flip: () => { S.flipped = !S.flipped; render(); },
  reveal: () => { S.revealed = true; render(); },
  color: v => { cfg.user = v; syncSettings(); },
  level: v => { cfg.level = Number(v); if (P) P.level = cfg.level; syncSettings(); },
  topen: v => openTrainer(v),
  tback: () => { T.id = null; R.token++; sfAbort(R); R.thinking = false; render(); },
  stage: v => setStage(v),
  tline: v => { T.line = Number(v); T.ply = 0; if (T.stage === 'learn') { buildLearn(); render(); } else if (T.stage === 'drill') drillStart(); else render(); },
  tply: v => learnGoto(Number(v), true),
  'l-first': () => learnGoto(0, false),
  'l-prev': () => learnGoto(T.ply - 1, false),
  'l-next': () => learnGoto(T.ply + 1, true),
  'l-last': () => learnGoto(999, false),
  tguided: v => { T.guided = v === '1'; drillStart(); },
  'd-restart': () => drillStart(),
  'd-unguided': () => { T.guided = false; drillStart(); },
  'd-show': () => {
    const d = R.drill;
    if (!d || d.done || R.thinking || R.game.turn() !== R.user) return;
    d.hints++;
    R.guide = sanToSquares(R.game, d.toks[R.game.history().length]);
    d.wrong = d.wrong || null;
    if (!d.guided) d.shown = true;
    render();
  },
  tlevel: v => { T.level = Number(v); render(); },
  tstart: () => testStart(),
  kb: v => { const k = KB.find(x => x.id === v); if (!k || Q.busy) return; bubble('user', k.q); bubble('bot', k.a); },
  analyze: () => analyzeGame(),
  bookwhere: () => bookWhere(),
  aitoggle: () => { Q.use = !Q.use; renderAINote(); },
  askstop: () => { if (Q.ctl) Q.ctl.abort(); },
  snd: () => toggleSound()
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACT[t.dataset.act];
  if (f) f(t.dataset.v, t);
});
$('sel-opening').addEventListener('change', e => { cfg.pick = e.target.value; });
$('sel-time').addEventListener('change', e => { cfg.time = e.target.value; });
$('askform').addEventListener('submit', e => { e.preventDefault(); const v = $('askin').value; $('askin').value = ''; ask(v); });

/* ============ Início ============ */
if (typeof Chess !== 'function') {
  document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px">Não consegui carregar a biblioteca de xadrez. Recarregue a página.</p>');
} else {
  loadProg();
  if (!TRAIN_FULL) $('train-label').textContent = 'Aula';
  validateLines();
  P = mkState(); R = mkState(); S = P;
  syncSettings();
  renderSndBtn();
  initChat();
  sfInit();
  startPlay();
}
</script>

<script>
/* Instalação e modo offline (só na versão para baixar) */
(function () {
  var deferred = null, btn = document.getElementById('install-btn');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (btn) btn.hidden = false; });
  window.addEventListener('appinstalled', function () { deferred = null; if (btn) btn.hidden = true; });
  if (btn) btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    Promise.resolve(deferred.userChoice).catch(function () {}).then(function () { deferred = null; btn.hidden = true; });
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
